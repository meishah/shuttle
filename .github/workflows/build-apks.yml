name: Build Shuttle APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build standalone debug APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleStandaloneDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: shuttle-apks-debug
          path: app/build/outputs/apk/standalone/debug/*.apk
          if-no-files-found: error
          retention-days: 30
