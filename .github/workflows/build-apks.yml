name: Build Shuttle APKs

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apks.yml"
      - "shuttle-code-latest.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract uploaded source archive
        run: |
          mkdir source
          unzip -q shuttle-code-latest.zip -d source
          test -f source/gradlew
          test -f source/settings.gradle.kts
          chmod +x source/gradlew

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # compileSdkMinor=2 requires the API 37 extension platform.
      # Do not downgrade: the app references API 37-only permission constants.
      - name: Install Android API 37 extension 2
        run: |
          yes | sdkmanager --channel=3 "platforms;android-37-ext2" "build-tools;37.0.0"

      - name: Build standalone debug APKs
        working-directory: source
        run: ./gradlew --no-daemon :app:assembleStandaloneDebug

      - name: Verify APK outputs
        run: |
          find source/app/build/outputs/apk/standalone/debug -maxdepth 1 -type f -name '*.apk' -print
          test "$(find source/app/build/outputs/apk/standalone/debug -maxdepth 1 -type f -name '*.apk' | wc -l)" -ge 3

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: shuttle-apks-debug
          path: source/app/build/outputs/apk/standalone/debug/*.apk
          if-no-files-found: error
          retention-days: 30
