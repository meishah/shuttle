        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            source/app/build/outputs/apk/standalone/release/shuttle-standalone-v1-arm64.apk
            source/app/build/outputs/apk/standalone/release/shuttle-standalone-v1-armv7.apk
            source/app/build/outputs/apk/standalone/release/shuttle-standalone-v1.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
, f'versionCode = "{version_code}"', content, count=1)
          if name_count != 1 or code_count != 1:
              raise SystemExit("Could not uniquely update versionName and versionCode in gradle/libs.versions.toml")
          catalog.write_text(content)
          print(f"Building Shuttle {version} with Android versionCode {version_code}")
          PY

      - name: Build standalone release APKs
        working-directory: source
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
