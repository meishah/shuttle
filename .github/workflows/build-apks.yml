name: Build Shuttle APKs

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apks.yml"
      - "shuttle-code-latest.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract uploaded source archive
        run: |
          mkdir source
          unzip -q shuttle-code-latest.zip -d source
          test -f source/gradlew
          test -f source/settings.gradle.kts
          chmod +x source/gradlew

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # The uploaded project currently requests Android API 37.2, which
      # is not published in the runner's SDK package index yet. For this
      # CI-only debug build, compile/target against the available API 36.
      # The source archive and repository are not modified.
      - name: Install Android platform 36
        run: sdkmanager "platforms;android-36"

      - name: Apply CI-only SDK compatibility override
        working-directory: source
        run: |
          sed -i 's/compileSdk = "37"/compileSdk = "36"/' gradle/libs.versions.toml
          sed -i 's/compileSdkMinor = "2"/compileSdkMinor = "0"/' gradle/libs.versions.toml
          sed -i 's/targetSdk = "37"/targetSdk = "36"/' gradle/libs.versions.toml

      - name: Build standalone debug APKs
        working-directory: source
        run: ./gradlew --no-daemon :app:assembleStandaloneDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: shuttle-apks-debug
          path: source/app/build/outputs/apk/standalone/debug/*.apk
          if-no-files-found: error
          retention-days: 30
