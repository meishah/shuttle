name: Build Shuttle APKs

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apks.yml"
      - "shuttle-code-latest.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract uploaded source archive
        run: |
          mkdir source
          unzip -q shuttle-code-latest.zip -d source
          test -f source/gradlew
          test -f source/settings.gradle.kts
          chmod +x source/gradlew

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK Platform and Build Tools
        run: |
          yes | sdkmanager --channel=3 "platforms;android-37.2" "build-tools;36.0.0"

      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing GitHub Secret: KEYSTORE_BASE64"; exit 1; }
          mkdir -p "$RUNNER_TEMP/shuttle-signing"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shuttle-signing/shuttle-release.jks"
          test -s "$RUNNER_TEMP/shuttle-signing/shuttle-release.jks"
          echo "KEY_STORE_PATH=$RUNNER_TEMP/shuttle-signing/shuttle-release.jks" >> "$GITHUB_ENV"

      - name: Build standalone release APKs
        working-directory: source
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          ./gradlew --no-daemon :app:assembleStandaloneRelease

      - name: Verify APK signatures, certificates and ABIs
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="source/app/build/outputs/apk/standalone/release"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"

          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          test -d "$APK_DIR"

          ARM64="$APK_DIR/shuttle-standalone-v1-arm64.apk"
          ARMV7="$APK_DIR/shuttle-standalone-v1-armv7.apk"
          UNIVERSAL="$APK_DIR/shuttle-standalone-v1.apk"
          for apk in "$ARM64" "$ARMV7" "$UNIVERSAL"; do
            test -s "$apk" || { echo "Missing expected APK: $apk"; exit 1; }
          done

          apk_count=$(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' | wc -l)
          test "$apk_count" -eq 3 || { echo "Expected exactly 3 APKs, found $apk_count"; exit 1; }

          cert_digest() {
            local apk="$1"
            local report
            report=$("$APKSIGNER" verify --verbose --print-certs "$apk" 2>&1) || {
              echo "$report"
              echo "APK signature verification failed: $apk"
              return 1
            }
            echo "$report"
            local digests
            digests=$(printf '%s\n' "$report" | sed -n 's/.*certificate SHA-256 digest: //p' | sort -u)
            test -n "$digests" || { echo "No signer certificate digest found for $apk"; return 1; }
            printf '%s\n' "$digests"
          }

          cert_arm64=$(cert_digest "$ARM64" | tail -n 1)
          cert_armv7=$(cert_digest "$ARMV7" | tail -n 1)
          cert_universal=$(cert_digest "$UNIVERSAL" | tail -n 1)
          test "$cert_arm64" = "$cert_armv7" || { echo "Signing certificate mismatch: ARM64 vs ARMv7"; exit 1; }
          test "$cert_arm64" = "$cert_universal" || { echo "Signing certificate mismatch: ARM64 vs Universal"; exit 1; }
          echo "All APKs are signed and use the same certificate SHA-256: $cert_arm64"

          check_abis() {
            local apk="$1"
            local expected="$2"
            local actual
            actual=$(unzip -Z1 "$apk" | awk -F/ '$1 == "lib" && NF >= 3 && $3 ~ /\\.so$/ {print $2}' | sort -u | paste -sd ' ' -)
            test -n "$actual" || { echo "No native ABI libraries found in $apk"; return 1; }
            test "$actual" = "$expected" || {
              echo "ABI mismatch in $apk: expected [$expected], found [$actual]"
              return 1
            }
            echo "$(basename "$apk"): ABI [$actual] OK"
          }

          check_abis "$ARM64" "arm64-v8a"
          check_abis "$ARMV7" "armeabi-v7a"
          check_abis "$UNIVERSAL" "arm64-v8a armeabi-v7a"

          for apk in "$ARM64" "$ARMV7" "$UNIVERSAL"; do
            "$ZIPALIGN" -c -v 4 "$apk"
            echo "$(basename "$apk"): zipalign OK ($(stat -c '%s' "$apk") bytes)"
          done

      - name: Upload verified APKs
        uses: actions/upload-artifact@v4
        with:
          name: shuttle-apks-release
          path: source/app/build/outputs/apk/standalone/release/*.apk
          if-no-files-found: error
          retention-days: 30
