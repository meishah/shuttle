name: Build Shuttle Beta APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source archive
        run: |
          mkdir source
          unzip -q shuttle-code-latest.zip -d source
          test -f source/gradlew
          test -f source/gradle/libs.versions.toml
          chmod +x source/gradlew

      - name: Set beta version
        working-directory: source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("gradle/libs.versions.toml")
          rows = p.read_text().splitlines()
          found_name = found_code = False
          for i, row in enumerate(rows):
              if row.startswith("versionName = "):
                  rows[i] = 'versionName = "1.1.0-beta1"'
                  found_name = True
              elif row.startswith("versionCode = "):
                  rows[i] = 'versionCode = "1001001"'
                  found_code = True
          if not (found_name and found_code):
              raise SystemExit("Could not set Android version in version catalog")
          p.write_text("\n".join(rows) + "\n")
          PY

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK Platform and Build Tools
        run: |
          yes | sdkmanager --channel=3 "platforms;android-37.2" "build-tools;36.0.0"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing KEYSTORE_BASE64 secret"; exit 1; }
          mkdir -p "$RUNNER_TEMP/shuttle-signing"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shuttle-signing/shuttle-release.jks"
          test -s "$RUNNER_TEMP/shuttle-signing/shuttle-release.jks"
          echo "KEY_STORE_PATH=$RUNNER_TEMP/shuttle-signing/shuttle-release.jks" >> "$GITHUB_ENV"

      - name: Build signed standalone APKs
        working-directory: source
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          ./gradlew --no-daemon :app:assembleStandaloneRelease

      - name: Verify ARM64 APK
        run: |
          set -euo pipefail
          APK_DIR="source/app/build/outputs/apk/standalone/release"
          APK="$(find "$APK_DIR" -maxdepth 1 -type f -name '*arm64*.apk' -print -quit)"
          test -n "$APK" && test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK"
          echo "BETA_APK=$APK" >> "$GITHUB_ENV"

      - name: Upload beta APK (not a GitHub Release)
        uses: actions/upload-artifact@v4
        with:
          name: shuttle-1.1.0-beta1-arm64
          path: ${{ env.BETA_APK }}
          if-no-files-found: error
          retention-days: 30
